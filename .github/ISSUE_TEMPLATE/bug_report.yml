name: Bug report
description: Report a brightness, display, or app issue.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Mac model, macOS version, and Sunbar version
      placeholder: MacBook Pro 14-inch M1 Pro, macOS 27.2, Sunbar 0.6.1
    validations:
      required: true
  - type: input
    id: preset
    attributes:
      label: Display preset
      placeholder: Apple XDR Display
  - type: textarea
    id: context
    attributes:
      label: Where does it happen?
      description: Describe any connection to Mission Control, desktop swipes, full-screen apps, sleep, or app switching. Screenshots are welcome. Avoid personal information.
